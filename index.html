<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>S&S Construction and Projects</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #111315;
    color: white;
}

header {
    text-align: center;
    padding: 25px 20px;
}

.logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 90px;
    height: 90px;
    border: 4px solid #f47b20;
    border-radius: 50%;
    font-size: 25px;
    font-weight: 900;
}

.logo span {
    color: #f47b20;
}

.hero {
    min-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px 20px;
}

.hero-content {
    width: 100%;
    max-width: 650px;
}

h1 {
    font-size: clamp(42px, 10vw, 72px);
    line-height: 1;
    font-weight: 900;
    text-transform: uppercase;
    margin-bottom: 30px;
}

h1 span {
    color: #f47b20;
}

.buttons {
    display: flex;
    flex-direction: column;
    gap: 15px;
    max-width: 400px;
    margin: auto;
}

.btn {
    display: block;
    padding: 18px;
    border-radius: 8px;
    font-size: 18px;
    font-weight: 900;
    text-decoration: none;
    text-transform: uppercase;
}

.quote {
    background: #f47b20;
    color: #111315;
}

.call {
    border: 2px solid #f47b20;
    color: white;
}

.contact {
    background: #f5f5f5;
    color: #111315;
    text-align: center;
    padding: 55px 20px;
}

.contact h2 {
    font-size: 34px;
    margin-bottom: 25px;
}

.contact-item {
    max-width: 500px;
    margin: 12px auto;
    padding: 17px;
    background: white;
    border-radius: 8px;
    font-weight: bold;
}

.contact-item a {
    color: #111315;
    text-decoration: none;
}

.whatsapp {
    display: block;
    max-width: 500px;
    margin: 22px auto 0;
    padding: 18px;
    background: #25D366;
    color: white;
    border-radius: 8px;
    font-size: 18px;
    font-weight: 900;
    text-decoration: none;
}

footer {
    text-align: center;
    padding: 20px;
    background: #111315;
    color: #888;
    font-size: 13px;
}

@media (max-width: 500px) {
    .hero {
        min-height: 65vh;
    }

    h1 {
        font-size: 43px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">
        S<span>&</span>S
    </div>
</header>

<section class="hero">
    <div class="hero-content">

        <h1>
            Quality Construction.<br>
            <span>Built To Last.</span>
        </h1>

        <div class="buttons">

            <a class="btn quote"
               href="https://wa.me/27721517269?text=Hello%20S%26S%20Construction%2C%20I%20would%20like%20a%20quote.">
                Get a Quote
            </a>

            <a class="btn call"
               href="tel:+27721517269">
                Call Now
            </a>

        </div>

    </div>
</section>

<section class="contact">

    <h2>Contact Us</h2>

    <div class="contact-item">
        📞 <a href="tel:+27721517269">072 151 7269</a>
    </div>

    <div class="contact-item">
        📞 <a href="tel:+27653395083">065 339 5083</a>
    </div>

    <div class="contact-item">
        ✉️ <a href="mailto:ssconstructprojects@gmail.com">
            ssconstructprojects@gmail.com
        </a>
    </div>

    <a class="whatsapp"
       href="https://wa.me/27721517269"
       target="_blank">
        💬 WhatsApp Us
    </a>

</section>

<footer>
    © 2026 S&S Construction and Projects
</footer>

</body>
</html>
